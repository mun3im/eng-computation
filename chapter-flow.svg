<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <style>
    .part-box { stroke-width: 1.5; }
    .part-title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
    .part-range { font-size: 12px; fill: #444; }
    .ch-label { font-size: 11px; fill: #333; }
    .flow-line { stroke: #555; stroke-width: 2; fill: none; }
    .enrich-box { stroke-width: 1.5; fill: #f4f1fa; stroke: #8a6fc9; }
    .enrich-title { font-size: 13px; font-weight: 700; fill: #4b2e9e; }
    .enrich-label { font-size: 11px; fill: #4b2e9e; }
    .section-caption { font-size: 12px; fill: #666; font-style: italic; }
  </style>

  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">
    Engineering Computation with Python — Chapter Flow
  </text>
  <text x="600" y="52" text-anchor="middle" class="section-caption">
    engineering problem → mathematical model → Python computation
  </text>

  <!-- Part I -->
  <rect x="30" y="90" width="260" height="150" class="part-box" rx="10" fill="#eaf2fb" stroke="#3b7dd8"/>
  <text x="160" y="115" text-anchor="middle" class="part-title">Part I</text>
  <text x="160" y="132" text-anchor="middle" class="part-range">Your First Engineering Programs</text>
  <text x="160" y="148" text-anchor="middle" class="part-range">Chapters 1–5</text>
  <text x="45" y="170" class="ch-label">1. Computing as an Engineering Tool</text>
  <text x="45" y="186" class="ch-label">2. Algorithms and Flowcharts</text>
  <text x="45" y="202" class="ch-label">3. First Programs &amp; Engineering Units</text>
  <text x="45" y="218" class="ch-label">4. Decisions and Repetition</text>
  <text x="45" y="234" class="ch-label">5. Functions</text>

  <!-- Part II -->
  <rect x="320" y="90" width="260" height="150" class="part-box" rx="10" fill="#eafaf0" stroke="#2f9e5c"/>
  <text x="450" y="115" text-anchor="middle" class="part-title">Part II</text>
  <text x="450" y="132" text-anchor="middle" class="part-range">Seeing Engineering Mathematics</text>
  <text x="450" y="148" text-anchor="middle" class="part-range">Chapters 6–9</text>
  <text x="335" y="170" class="ch-label">6. Arrays as Engineering Data</text>
  <text x="335" y="186" class="ch-label">7. Graphing Functions and Signals</text>
  <text x="335" y="202" class="ch-label">8. Complex Numbers for AC Circuits</text>
  <text x="335" y="218" class="ch-label">9. Matrices for Circuit Equations</text>

  <!-- Part III -->
  <rect x="610" y="90" width="260" height="150" class="part-box" rx="10" fill="#fdf3e3" stroke="#d99a2b"/>
  <text x="740" y="115" text-anchor="middle" class="part-title">Part III</text>
  <text x="740" y="132" text-anchor="middle" class="part-range">Working with Engineering Data</text>
  <text x="740" y="148" text-anchor="middle" class="part-range">Chapters 10–12</text>
  <text x="625" y="170" class="ch-label">10. Measurements and Files</text>
  <text x="625" y="186" class="ch-label">11. Errors and Imperfect Data</text>
  <text x="625" y="202" class="ch-label">12. Interpolation, Curve Fitting,</text>
  <text x="625" y="216" class="ch-label">    and Calibration</text>

  <!-- Part IV -->
  <rect x="900" y="90" width="270" height="150" class="part-box" rx="10" fill="#fbeaea" stroke="#c0453f"/>
  <text x="1035" y="115" text-anchor="middle" class="part-title">Part IV</text>
  <text x="1035" y="132" text-anchor="middle" class="part-range">From Models to Prediction</text>
  <text x="1035" y="148" text-anchor="middle" class="part-range">Chapters 13–14</text>
  <text x="915" y="170" class="ch-label">13. Numerical Calculus and</text>
  <text x="915" y="184" class="ch-label">    System Models</text>
  <text x="915" y="202" class="ch-label">14. Data Analytics and a First</text>
  <text x="915" y="216" class="ch-label">    Look at Machine Learning</text>

  <!-- arrows between parts -->
  <path d="M290,165 L318,165" class="flow-line" marker-end="url(#arrow)"/>
  <path d="M580,165 L608,165" class="flow-line" marker-end="url(#arrow)"/>
  <path d="M870,165 L898,165" class="flow-line" marker-end="url(#arrow)"/>

  <!-- Enrichment chapters -->
  <path d="M1035,240 L1035,280 L700,280 L700,320" class="flow-line" marker-end="url(#arrow)"/>

  <rect x="440" y="330" width="260" height="90" class="enrich-box" rx="10"/>
  <text x="570" y="355" text-anchor="middle" class="enrich-title">Chapter 15 (enrichment)</text>
  <text x="570" y="373" text-anchor="middle" class="enrich-label">A First Look at</text>
  <text x="570" y="389" text-anchor="middle" class="enrich-label">Object-Oriented Python</text>
  <text x="570" y="408" text-anchor="middle" font-size="10" fill="#777">outside the taught weeks</text>

  <path d="M700,330 L700,300" class="flow-line" marker-end="url(#arrow)"/>

  <rect x="440" y="440" width="260" height="60" class="enrich-box" rx="10"/>
  <text x="570" y="463" text-anchor="middle" class="enrich-title">Chapter 16 (integrative)</text>
  <text x="570" y="481" text-anchor="middle" class="enrich-label">Engineering Mini-Projects</text>

  <path d="M570,420 L570,438" class="flow-line" marker-end="url(#arrow)"/>
</svg>
